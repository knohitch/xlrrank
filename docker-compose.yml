name: xlrrank

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: xlrrank-postgres
    environment:
      POSTGRES_USER: xlrrank
      POSTGRES_PASSWORD: xlrrank
      POSTGRES_DB: xlrrank
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xlrrank"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - xlrrank-net

  redis:
    image: redis:7-alpine
    container_name: xlrrank-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data
    networks:
      - xlrrank-net

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: api
    container_name: xlrrank-api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://xlrrank:xlrrank@postgres:5432/xlrrank
      REDIS_URL: redis://redis:6379
      QUEUE_URL: redis://redis:6379
      API_PUBLIC_URL: http://localhost:4000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      STORAGE_DRIVER: filesystem
      STORAGE_LOCAL_PATH: /data/storage
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_data:/data
    networks:
      - xlrrank-net

  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: worker
    container_name: xlrrank-worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://xlrrank:xlrrank@postgres:5432/xlrrank
      REDIS_URL: redis://redis:6379
      QUEUE_URL: redis://redis:6379
      STORAGE_DRIVER: filesystem
      STORAGE_LOCAL_PATH: /data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_data:/data
    networks:
      - xlrrank-net

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: web
    container_name: xlrrank-web
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      API_PUBLIC_URL: http://localhost:4000
      DATABASE_URL: postgres://xlrrank:xlrrank@postgres:5432/xlrrank
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - xlrrank-net

volumes:
  postgres_data:
  redis_data:
  app_data:

networks:
  xlrrank-net:
    driver: bridge
