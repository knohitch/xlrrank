name: Audit Baseline

on:
  push:
    branches: [master, audit/**]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  NODE_ENV: test
  DATABASE_URL: postgres://xlrrank:xlrrank@localhost:5432/xlrrank_audit
  REDIS_URL: redis://localhost:6379
  QUEUE_URL: redis://localhost:6379
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  API_PUBLIC_URL: http://localhost:4000
  CORS_ORIGIN: http://localhost:3000
  STORAGE_DRIVER: filesystem
  STORAGE_LOCAL_PATH: ./storage-audit
  ENCRYPTION_MASTER_KEY: audit-only-master-key-32-bytes-minimum-value-for-ci
  SESSION_SIGNING_SECRET: audit-only-session-signing-secret-value-for-ci
  SESSION_ENCRYPTION_SECRET: audit-only-session-encryption-secret-value-for-ci
  PASSWORD_RESET_SECRET: audit-only-password-reset-secret-value-for-ci
  EMAIL_TRANSPORT: console
  MIGRATION_INTEGRATION_TEST: "1"

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile --offline

  constitution:
    name: Constitution Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:constitution

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint --concurrency=2

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck --concurrency=2

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run workspace tests
        run: pnpm test --concurrency=2
      - name: Run security tests
        if: always()
        run: node --test scripts/security.test.mjs

  migration-integration:
    name: PostgreSQL Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: install
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: xlrrank
          POSTGRES_PASSWORD: xlrrank
          POSTGRES_DB: xlrrank_audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xlrrank -d xlrrank_audit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run migrations
        run: pnpm db:migrate
      - name: Re-apply migrations (idempotence)
        run: pnpm db:migrate
      - name: Verify pgvector
        run: PGPASSWORD=xlrrank psql -h localhost -U xlrrank -d xlrrank_audit -v ON_ERROR_STOP=1 -c "SELECT extname FROM pg_extension WHERE extname='vector';"
      - name: Verify key tables
        run: PGPASSWORD=xlrrank psql -h localhost -U xlrrank -d xlrrank_audit -v ON_ERROR_STOP=1 -c "SELECT count(*) AS table_count FROM information_schema.tables WHERE table_schema='public';"
      - name: Run migration integration test
        run: node --test packages/database/test/migration-integration.test.mjs

  docker:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: install
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet

  security-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run dependency audit
        run: pnpm audit --prod
        continue-on-error: true
