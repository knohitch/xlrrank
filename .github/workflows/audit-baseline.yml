name: XLRrank Independent Audit Baseline

on:
  push:
    branches:
      - audit/production-verification-2026-09-04
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: xlrrank
          POSTGRES_PASSWORD: xlrrank
          POSTGRES_DB: xlrrank_audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xlrrank -d xlrrank_audit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://xlrrank:xlrrank@localhost:5432/xlrrank_audit
      REDIS_URL: redis://localhost:6379
      QUEUE_URL: redis://localhost:6379
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      API_PUBLIC_URL: http://localhost:4000
      CORS_ORIGIN: http://localhost:3000
      STORAGE_DRIVER: filesystem
      STORAGE_LOCAL_PATH: ./storage-audit
      ENCRYPTION_MASTER_KEY: audit-only-master-key-32-bytes-minimum-value
      SESSION_SIGNING_SECRET: audit-only-session-signing-secret-value
      SESSION_ENCRYPTION_SECRET: audit-only-session-encryption-secret-value
      PASSWORD_RESET_SECRET: audit-only-password-reset-secret-value
      EMAIL_TRANSPORT: console

    steps:
      - name: Checkout audited branch
        uses: actions/checkout@v4

      - name: Upload source snapshot for independent inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xlrrank-audit-source
          include-hidden-files: true
          retention-days: 1
          path: |
            .
            !.git/**
            !node_modules/**
            !**/node_modules/**
            !**/.next/**
            !**/dist/**

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Clean install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Lockfile/package integrity
        run: pnpm install --frozen-lockfile --offline

      - name: Constitution guard
        run: pnpm lint:constitution

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Existing test suite
        run: pnpm test

      - name: Apply migrations to empty PostgreSQL database
        run: pnpm db:migrate

      - name: Verify migrated schema exists
        run: |
          PGPASSWORD=xlrrank psql -h localhost -U xlrrank -d xlrrank_audit -v ON_ERROR_STOP=1 -c "SELECT count(*) AS table_count FROM information_schema.tables WHERE table_schema='public';"
          PGPASSWORD=xlrrank psql -h localhost -U xlrrank -d xlrrank_audit -v ON_ERROR_STOP=1 -c "SELECT extname FROM pg_extension WHERE extname='vector';"

      - name: Production build
        run: pnpm build

      - name: Docker Compose configuration validation
        run: docker compose config --quiet

      - name: Production dependency audit
        continue-on-error: true
        run: pnpm audit --prod
